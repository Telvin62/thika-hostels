<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thika Hostels - Book Now</title>
<style>
body{font-family:sans-serif;background:#f2f2f2;margin:0;padding:15px}
h1{text-align:center;color:#1a73e8}
.card{background:white;border-radius:12px;padding:15px;margin:12px 0;box-shadow:0 2px 8px #ccc}
.card h3{margin:5px 0}
button{background:#1a73e8;color:white;border:none;padding:10px 18px;border-radius:8px;font-size:16px;width:100%}
input{width:100%;padding:10px;margin:6px 0;border:1px solid #ccc;border-radius:8px;box-sizing:border-box}
.price{color:green;font-weight:bold;font-size:18px}
</style></head>
<body>
<h1>🏠 Thika Hostels</h1>
<p style="text-align:center">Book your hostel in Thika - by Telvin Asher Abel</p>
<div id="hostels">Loading...</div>
<script>
async function load(){
  let r = await fetch('/api/hostels');
  let data = await r.json();
  let html = '';
  data.forEach(h=>{
    html += `<div class="card"><div style="font-size:40px">${h.image}</div><h3>${h.name}</h3><p>📍 ${h.location}</p><p class="price">KSh ${h.price} / month</p><p>🛏️ ${h.available} rooms available</p><input id="name${h.id}" placeholder="Your Full Name"><input id="phone${h.id}" placeholder="M-Pesa Phone e.g 0769751803"><button onclick="book(${h.id},${h.price})">Book Now + Pay with M-Pesa</button><p id="msg${h.id}"></p></div>`;
  });
  document.getElementById('hostels').innerHTML = html;
}
async function book(id, price){
  let name = document.getElementById('name'+id).value;
  let phone = document.getElementById('phone'+id).value;
  if(!name || !phone){ alert('Fill name and phone!'); return; }
  let r = await fetch('/api/bookings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({hostelId:id,name,phone})});
  let d = await r.json();
  if(d.booking){
    let p = await fetch('/api/payments',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({bookingId:d.booking.id,phone,amount:price})});
    let pd = await p.json();
    let waMsg=encodeURIComponent('Hi! I want to book Hostel ID '+id+'. My name is '+name+', my M-Pesa number is '+phone+'. Booking ID: '+d.booking.id); window.open('https://wa.me/254769751803?text='+waMsg,'_blank'); document.getElementById('msg'+id).innerHTML = '✅ '+d.message+'<br>💚 '+pd.message+'<br>Booking ID: '+d.booking.id;
    load();
  } else { document.getElementById('msg'+id).innerHTML = d.message; }
}
load();
</script>
<!-- WHATSAPP + TEST PAYMENT -->
<style>
#waBtn{position:fixed;bottom:20px;right:20px;background:#25D366;color:#fff;width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:32px;text-decoration:none;z-index:9999;box-shadow:0 4px 12px rgba(0,0,0,.3)}
#payBox{display:none;position:fixed;bottom:80px;left:20px;background:#fff;border:2px solid #111;border-radius:12px;padding:12px;z-index:9999;box-shadow:0 4px 12px rgba(0,0,0,.2);max-width:240px}
#payBox button{width:100%;margin:4px 0;padding:10px;border:none;border-radius:8px;font-weight:bold;cursor:pointer}
</style>
<a id="waBtn" href="https://wa.me/254716921326?text=Hi!%20I%20want%20to%20book%20a%20hostel%20in%20Thika" target="_blank">💬</a>
<button id="payToggle" onclick="document.getElementById('payBox').style.display = document.getElementById('payBox').style.display==='block'?'none':'block'" style="position:fixed;bottom:20px;left:20px;background:#111;color:#fff;padding:12px 16px;border:none;border-radius:25px;font-weight:bold;z-index:9999;box-shadow:0 4px 12px rgba(0,0,0,.3)">💳 Pay</button><div id="payBox">
<b>💳 Pay (TEST MODE)</b><br><small>No real money moves</small><br>
<button style="background:#4CAF50;color:#fff" onclick="payMpesa()">M-Pesa (Test)</button>
<button style="background:#FFC107" onclick="payCash()">Cash on Arrival</button>
<button style="background:#25D366;color:#fff" onclick="payWa()">Pay via WhatsApp</button>
<div id="payMsg" style="font-size:13px;margin-top:6px"></div>
</div>
<script>
function payMpesa(){
 let phone = prompt("Enter M-Pesa number for TEST (e.g 0716921326):","0716921326");
 if(!phone) return;
 document.getElementById('payMsg').innerHTML = "Sending TEST STK Push to "+phone+"...";
 setTimeout(()=>{ document.getElementById('payMsg').innerHTML = "TEST SUCCESS! M-Pesa STK Push Sent to "+phone+"<br>No real money was charged."; },1500);
}
function payCash(){ document.getElementById('payMsg').innerHTML = "Booked! Pay Cash on Arrival. We will confirm on WhatsApp."; }
function payWa(){ window.open("https://wa.me/254716921326?text=Hi!%20I%20want%20to%20pay%20for%20my%20hostel%20booking","_blank"); }
</script>

</body></html>
